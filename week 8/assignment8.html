<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
     
</head>
<body>
    <div class="browser">
        <div class="browser-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>

        <div class="dashboard">
            <header class="head">
                <h1>My Dashboard</h1>
            </header>

            <aside class="side">
                <h2>Menu</h2>
                <ul>
                    <li>Home</li>
                    <li>Reports</li>
                    <li>Settings</li>
                </ul>
            </aside>

            <main class="main">
                <div class="card"><span class="icon">👤</span><span><strong>120</strong><br>Users</span></div>
                <div class="card"><span class="icon">💰</span><span><strong>Rs 45k</strong><br>Sales</span></div>
                <div class="card"><span class="icon">📦</span><span><strong>36</strong><br>Orders</span></div>
                <div class="card"><span class="icon">⭐</span><span><strong>4.8</strong><br>Rating</span></div>
                <div class="card"><span class="icon">💬</span><span><strong>18</strong><br>Messages</span></div>
                <div class="card"><span class="icon">✅</span><span><strong>92%</strong><br>Done</span></div>
            </main>

            <footer class="foot">
                Made with CSS Grid
            </footer>
        </div>
    </div>
</body>
</html>
