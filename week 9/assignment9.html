<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderGo | Plan your next trip</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <a class="brand" href="#" aria-label="WanderGo home">WanderGo</a>
            <nav aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#trips">Trips</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <main>
            <section class="hero" id="home">
                <h1>Plan your next trip in minutes</h1>
                <p class="hero-subtitle">Simple, cheap and fun travel plans.</p>
                <div class="hero-image" role="img" aria-label="Travel destination image placeholder">
                    <span>img/hero.jpg</span>
                </div>
            </section>

            <section class="features" id="trips" aria-label="Why travel with WanderGo">
                <article class="feature-card">
                    <h2>Easy Booking</h2>
                    <p>Book in 3 clicks.</p>
                </article>
                <article class="feature-card">
                    <h2>Best Prices</h2>
                    <p>We compare for you.</p>
                </article>
                <article class="feature-card">
                    <h2>24x7 Help</h2>
                    <p>We're here whenever you need us.</p>
                </article>
            </section>
        </main>

        <footer class="site-footer" id="contact">
            Ready for your next adventure?
        </footer>
    </div>
</body>
</html>
