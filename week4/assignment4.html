<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <center>
        <h1><u>Student registration form</u></h1>
    </center>
    <lable  for="Name"> Name:</lable>
        <input
        type="text"
        name="name"
        placeholder="   enter the name  ">
      <required>
   
<br><br>
<lable  for="email"> Email:</lable>
        <input
        type="email"
        name="email"
        placeholder="   enter the email ">
      <required> <br><br>
        <lable  for="Passward"> Password:</lable>
        <input
        type="password"
        name="password"
        placeholder="   enter the gmail password  "
      required> <br><br>
        <lable  for="contect.number"> Contect.Number:</lable>
        <input
        type="tel"
        name="phone"
        placeholder="   enter the contect number  ">
      <required>
        <br><br>
        <lable  for="Date"> Date:</lable>
        <input
        type="date"
         name="dob"
        placeholder="   enter your dob  "> 
      <required>
        <br><br>
        
        <p> <b>Gender</b></p>
   <label>
    <input
    type="radio"
    name="Gender"
    value="Male">Male:
   </label>
   <label>
   <input
    type="radio"
    name="Gender"
    value="Female">Female:
   </label>
   
   </label><br><br>

   <p><b>Interest:</b></p>
   <label>
    <input
    type="checkbox"
    name="SkilLS"
    value="Html">Html:
   </label>
   <label>
    <input
    type="checkbox"
    name="SkilLS"
    value="Java">Java:
   </label>
   <label>
    <input
    type="checkbox"
    name="SkillS"
    value="CSS">CSS:
   </label>
   <label>
    <input
    type="checkbox"
    name="SkillS"
    value="Java script">Java script:
   </label>
   <br><br>
   <label for="course"><b>Branch:</b></label>
   <select name="course">
    
    <option value="B.tech">B.tech:</option>
    <option value="BCA">BCA:</option>
    <option value="AI">AI:</option>
   </select>
   <br><br>
   <lable for="reason"> Why do you want to join?</lable>
   <br>
  <textarea
  name="reason"
  row="3"
  cols="50">
  </textarea>
  <br><br>
  <button type="Register">Register</button>
</body>
</html>
